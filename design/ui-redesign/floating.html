<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diverge 悬浮窗状态预览</title><link rel="stylesheet" href="../../ui/theme.css"><link rel="stylesheet" href="../../content/styles.css"><link rel="stylesheet" href="design.css"><style>body{padding:22px}.host-window{min-height:750px}.host-main{max-width:850px}.host-board-wrap{max-width:480px}.preview-fixed-note{margin:18px 0;color:var(--muted);font-size:11px}#maia3-intuition-panel{top:115px;right:32px}#maia-wechat-float{top:115px;right:32px}@media(max-width:760px){body{padding:12px}#maia3-intuition-panel{top:190px;right:22px}.host-main{padding:20px}.host-window{min-height:820px}}</style></head><body class="diverge-ui"><div class="stage-tools"><div><div class="eyebrow">ON THE BOARD</div><h1>每个状态，都有清晰的回应。</h1></div><label class="state-picker">界面状态<select id="preview-state"><option value="review">赛后复盘</option><option value="idle">赛前 · 未启动</option><option value="locked">对局进行中 · 锁定</option><option value="download">模型下载中</option><option value="error">模型加载失败</option></select></label></div><div class="host-window"><div class="host-toolbar"><i class="window-dot"></i><i class="window-dot"></i><i class="window-dot"></i><span class="host-address">示意棋盘页面 · 未连接棋类平台</span><span id="host-stage">已完赛复盘</span></div><div class="host-main"><div class="host-game-heading"><strong>Kasparov — Topalov</strong><span class="tag neutral">内置棋谱片段</span></div><div id="preview-board" class="demo-board host-board-wrap"></div><p class="host-annotation">悬浮窗使用项目正式组件。可拖动标题、展开设置、切换语言、收起与恢复。这里只演示 UI，不执行棋局计算。</p></div></div><script type="module" src="floating.js"></script></body></html>
