<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>歧路 Diverge · 复盘与设置</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="diverge-ui">
  <main class="popup-page">
    <header class="popup-header">
      <div class="popup-brand">
        <span class="popup-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8c0-4.5-6-4.5-6-9m6 9c0-4.5 6-4.5 6-9"/><path d="m3 7 3-3 3 3m6 0 3-3 3 3"/></svg></span>
        <div><h1>歧路 Diverge</h1><p data-i18n="popupSubtitle">人类直觉 · 引擎洞察</p></div>
      </div>
      <span id="status-pill" class="status-pill" data-i18n="reviewOnly">仅供复盘</span>
    </header>
    <section class="popup-hero">
      <div class="eyebrow">ANOTHER WAY TO SEE YOUR GAME</div>
      <h2 data-i18n="popupHeadline">每一步，都有<br>另一种可能。</h2>
      <p data-i18n="popupIntro">回看你的选择，发现直觉之外的好棋。</p>
    </section>
    <nav class="popup-actions" aria-label="分析页面">
      <a href="https://4chess.cc" target="_blank" rel="noopener" class="action-primary"><span data-i18n="btnReviewStudio">进入全盘分析</span><span aria-hidden="true">↗</span></a>
      <div class="platform-actions">
        <a href="https://lichess.org/analysis" target="_blank" rel="noopener" data-i18n="btnLichess">Lichess 分析板</a>
        <a href="https://www.chess.com/analysis" target="_blank" rel="noopener" data-i18n="btnChesscom">Chess.com 分析板</a>
      </div>
    </nav>
    <section class="popup-preferences" aria-label="复盘偏好">
      <label class="setting-row" for="toggle-panel-switch"><span><strong data-i18n="floatingPanelTitle">棋盘悬浮窗</strong><small data-i18n="floatingPanelDesc">分析时随手查看当前局面</small></span><input type="checkbox" id="toggle-panel-switch" class="weui-switch" checked></label>
      <label class="setting-row" for="toggle-live-eval-switch"><span><strong data-i18n="liveEvalTitle">实时评估</strong><small data-i18n="liveEvalDesc">棋盘走法建议与直觉热力图</small></span><input type="checkbox" id="toggle-live-eval-switch" class="weui-switch" checked></label>
      <label class="setting-row" for="default-elo"><span><strong data-i18n="defaultEloLabel">人类直觉等级</strong><small data-i18n="eloHelp">用于 Maia 候选着法预测</small></span><select id="default-elo"><option value="1100" data-i18n="eloBeginner">1100 · 初阶</option><option value="1500" data-i18n="eloIntermediate">1500 · 中阶</option><option value="1900" selected data-i18n="eloClub">1900 · 进阶</option><option value="2200" data-i18n="eloMaster">2200 · 大师</option></select></label>
    </section>
    <details class="advanced-settings">
      <summary data-i18n="sectionEnginePrefs">模型与下载设置</summary>
      <label for="model-preset-select" data-i18n="modelSpecLabel">模型规格</label>
      <select id="model-preset-select"><option value="https://weights.4chess.cc/maia3_model.bin" selected data-i18n="modelStandard">标准 · 28 MB</option><option value="https://weights.4chess.cc/maia3_23m.bin" data-i18n="modelLarge">大规格 · 104 MB</option><option value="custom" data-i18n="modelCustomOption">自定义 CDN 地址</option></select>
      <input type="url" id="cdn-url" style="display:none" aria-label="模型 CDN URL" placeholder="https://weights.4chess.cc/maia3_model.bin">
      <p data-i18n="modelCacheHelp">首次使用下载模型，完成后缓存在浏览器中。</p>
    </details>
    <aside class="fair-play-note"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 8 3v6c0 5-8 9-8 9S4 17 4 12V6z"/><path d="m8 12 3 3 5-6"/></svg><p data-i18n="fairPlayNote">对局进行中自动锁定，结束后立即解锁复盘。</p></aside>
    <footer class="popup-footer"><span>MAIA × STOCKFISH</span><button type="button" data-theme-toggle>深色</button></footer>
  </main>
  <script src="popup.js"></script>
  <script type="module" src="../ui/theme.js"></script>
</body>
</html>
