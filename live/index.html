<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="在 4chess.cc 观赛，跟随棋王战官方转播，用 Stockfish 19 和 Maia-3 回看实战着法。">
  <title>2026 棋王战 · Diverge</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/analysis/analysis.css?v=20261125-position-poster">
  <link rel="stylesheet" href="/ui/chessboard.css?v=20261025-v115">
  <link rel="stylesheet" href="./live.css?v=20261125-trend-lines">
</head>
<body class="live-page">
  <header class="event-nav">
    <a class="event-brand" href="/">Diverge</a>
    <h1 id="title">2026 棋王战</h1>
    <div class="match-score" id="match-score" role="group" aria-label="赛况总比分"></div>
    <button type="button" class="btn-header btn-settings" id="btn-settings" aria-label="设置" data-label="settings" aria-haspopup="dialog">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="../ui/studio-controls.svg#settings"/></svg>
    </button>
    <button type="button" id="language" aria-label="Language">EN</button>
  </header>
  <main class="event-main">
    <nav id="round-rail" class="round-rail" aria-label="赛程与比分"></nav>
    <div class="event-layout">
      <section class="board-column" aria-label="转播棋盘">
        <header class="round-strip">
          <h2 id="round-title" hidden></h2>
          <span class="event-status" id="event-status" role="status">正在连接 Lichess 转播</span>
          <time id="round-time" hidden></time>
          <strong id="round-countdown" hidden></strong>
        </header>
        <div class="seat" id="black-seat"><span id="black-name">黑方</span><time id="black-clock">–:––</time></div>
        <div class="board-with-evaluation" id="board-frame">
          <div class="evaluation-gauge" id="evaluation-gauge" role="img" aria-label="白方视角评估">
            <div class="gauge-black" id="gauge-black"><span id="gauge-score-black"></span></div>
            <div class="gauge-white" id="gauge-white"><span id="gauge-score-white">—</span></div>
          </div>
          <span id="mobile-gauge-score" aria-hidden="true">—</span>
          <div id="event-board" class="maia-board-wrapper" aria-label="国际象棋棋盘"></div>
        </div>
        <div class="seat" id="white-seat"><span id="white-name">白方</span><time id="white-clock">–:––</time></div>
        <div class="board-controls round-controls">
          <div class="btn-nav-group live-nav">
            <button id="first" class="btn-nav desktop-control" type="button" aria-label="第一步" data-label="first">|◀</button>
            <div id="trend-mobile-slot"></div>
            <button id="previous" class="btn-nav" type="button" aria-label="上一步" data-label="previous">◀</button>
            <button id="play" class="btn-nav desktop-control" type="button" aria-label="自动播放">▶</button>
            <button id="next" class="btn-nav" type="button" aria-label="下一步" data-label="next">▶</button>
            <button id="latest" class="btn-nav" type="button" aria-label="回到最新" data-label="latest">▶|</button>
            <button id="flip-board" class="btn-nav" type="button" aria-label="翻转棋盘" data-label="flip">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="../ui/studio-controls.svg#flip"/></svg>
            </button>
            <button id="clear-notes" class="btn-nav desktop-control" type="button" aria-label="清除思考箭头" data-label="clear">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="../ui/studio-controls.svg#clear"/></svg>
            </button>
            <button id="sound" class="btn-nav desktop-control" type="button" aria-label="行棋音效">
              <svg id="sound-on" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="../ui/studio-controls.svg#sound-on"/></svg>
              <svg id="sound-off" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><use href="../ui/studio-controls.svg#sound-off"/></svg>
            </button>
          </div>
          <div class="board-share">
            <button id="moment" type="button" data-label="share" disabled><span class="toolbar-text" data-copy="share">分享局面卡</span><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4m1 4h3v10H4V11h3"/></svg></button>
            <button id="copy-live-link" type="button" data-copy="copyLink" disabled>复制链接</button>
          </div>
        </div>
        <input id="live-link-field" class="live-link-field" type="url" readonly aria-label="分享链接" data-label="shareLink" hidden>
        <p id="live-link-status" class="live-link-status" role="status"></p>
        <a id="workbench-game" class="workbench-game" target="_blank" rel="noopener" hidden></a>
      </section>
      <section class="event-panel" aria-label="着法和双引擎">
        <button type="button" id="new-move" class="update-button" hidden></button>
        <header class="moves-heading">
          <h2 data-copy="moves">实战着法</h2>
          <span id="intuition-tag" class="intuition-tag" hidden></span>
          <span id="ply-note"></span>
          <button id="return-game" type="button" data-copy="returnGame" hidden>返回实战</button>
        </header>
        <div id="event-moves" class="event-moves"></div>
        <section class="engine-pane" aria-labelledby="engine-title">
          <div class="engine-summary">
            <header>
              <h2 id="engine-title" data-copy="engines">双引擎对比</h2>
              <span id="mobile-moment-slot"></span>
              <div class="engine-controls">
                <button id="show-lines" type="button" data-copy="threeLines" aria-expanded="false" aria-controls="engine-lines" hidden>3 条</button>
                <button id="analyze" type="button" data-copy="pause" disabled>暂停双引擎</button>
              </div>
            </header>
            <div class="engine-downloads">
              <progress id="sf-progress" max="100" hidden></progress>
              <progress id="maia-progress" max="100" hidden></progress>
            </div>
            <p id="engine-note" role="status"></p>
            <div class="engine-lines" id="engine-lines" hidden>
              <div class="live-engine-group sf-group">
                <h3 class="candidate-heading" id="sf-edition"></h3>
                <div id="sf-candidates" class="candidate-lines"></div>
              </div>
              <div class="live-engine-group maia-group">
                <h3 class="candidate-heading" id="maia-edition"></h3>
                <div id="maia-candidates" class="candidate-lines"></div>
                <button id="load-maia" type="button" hidden></button>
              </div>
            </div>
          </div>
          <div class="engine-actions" id="trend-desktop-slot">
            <button id="trend-toggle" type="button" data-label="trend" aria-haspopup="dialog" aria-controls="live-trend" disabled>
              <span class="toolbar-text" data-copy="trend">人类视角</span>
              <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19h6m-5 3h4m-6-6v-2a6.5 6.5 0 1 1 8 0v2z"/></svg>
            </button>
          </div>
        </section>
      </section>
    </div>
    <footer class="event-source">
      <span data-copy="sourceLead">转播数据</span>
      <a id="source" href="https://lichess.org/broadcast/fide-world-chess-championship-2026/game-1/xLgOJ6cb" target="_blank" rel="noopener noreferrer">Lichess Broadcast</a>
      <span data-copy="delay">着法和时钟以转播为准，可能晚于现场。</span>
    </footer>
  </main>
  <dialog id="live-trend" class="live-trend" aria-labelledby="trend-title">
    <header class="live-share-heading">
      <h2 id="trend-title" data-copy="trend">人类视角</h2>
      <form method="dialog"><button type="submit" data-copy="close">关闭</button></form>
    </header>
    <div id="trend-board" aria-hidden="true"></div>
    <h3 class="trend-subtitle" data-copy="trendSubtitle">600–2600 Elo 怎么走</h3>
    <p id="trend-status" role="status"></p>
    <button id="trend-enable" type="button" hidden></button>
    <div id="trend-results" hidden>
      <p id="trend-conclusion"></p>
      <div class="trend-views">
        <button id="trend-chart-view" type="button" data-copy="chart" aria-pressed="true">曲线</button>
        <button id="trend-data-view" type="button" data-copy="trendData" aria-pressed="false">采样数据</button>
        <button id="trend-retry" type="button" data-copy="trendRetry" hidden>重试缺失档位</button>
      </div>
      <ul id="trend-legend" class="maia-trend-legend" data-label="trendLegend"></ul>
      <div id="trend-chart" class="maia-trend-chart"></div>
      <div id="trend-data" class="maia-trend-data" hidden><table></table></div>
    </div>
  </dialog>
  <dialog class="live-settings" id="live-settings" aria-labelledby="live-settings-title">
    <header class="live-share-heading">
      <h2 id="live-settings-title" data-copy="settings">设置</h2>
      <form method="dialog"><button type="submit" data-copy="close">关闭</button></form>
    </header>
    <div class="live-engine-settings">
      <label><span>Stockfish</span><select id="live-sf" disabled><option value="lite">SF19 Lite</option><option value="standard">SF19 Standard · 95 MiB</option></select></label>
      <label><span>Maia-3</span><select id="live-maia" disabled><option value="5m">5M</option><option value="23m" selected>23M</option><option value="79m">79M</option></select></label>
      <label><span data-copy="rating">段位</span><select id="event-elo" disabled>
        <option>1500</option><option>1900</option><option selected>2600</option>
      </select></label>
    </div>
    <div class="live-arrow-prefs">
      <label><input id="setting-sf-arrows" type="checkbox" checked> <span data-copy="sfArrows">Stockfish 箭头</span></label>
      <label><input id="setting-maia-arrows" type="checkbox" checked> <span data-copy="maiaArrows">Maia 箭头</span></label>
      <label><input id="setting-sound" type="checkbox" checked> <span data-copy="moveSound">行棋音效</span></label>
    </div>
    <p id="engine-hint" class="engine-hint"></p>
    <ul class="engine-health"><li id="sf-status"></li><li id="maia-status"></li></ul>
  </dialog>
  <dialog class="share-card-dialog" id="share-card-dialog" aria-labelledby="share-card-title">
    <header class="live-share-heading"><h2 id="share-card-title" data-copy="share">分享观赛海报</h2><button id="btn-close-share-card" type="button" data-copy="close">关闭</button></header>
    <p id="share-card-status" class="live-link-status" role="status"></p>
    <div id="share-card-progress" class="poster-progress" aria-hidden="true"><span></span></div>
    <div class="share-card-preview-wrap">
      <div id="share-card-placeholder" class="poster-placeholder" aria-hidden="true"><span></span><span></span><span></span></div>
      <canvas id="share-card-canvas" width="1080" height="1560" data-label="share" role="img" hidden></canvas>
    </div>
    <div class="share-card-actions">
      <button id="share-card-retry" type="button" hidden></button>
      <button id="btn-share-card-copy" type="button" data-copy="copyImage" disabled>复制图片</button>
      <button id="btn-share-card-download" type="button" data-copy="download" disabled>保存图片</button>
      <button id="btn-share-card-link" type="button" data-copy="copyLink" disabled>复制链接</button>
    </div>
    <p id="share-card-qr-note" class="live-link-status" data-copy="posterQrFallback" hidden></p>
    <p id="share-card-copy-status" class="live-link-status" role="status"></p>
    <input id="share-card-link-field" class="live-link-field" type="url" readonly aria-label="分享链接" data-label="shareLink" hidden>
  </dialog>
  <script type="module" src="./live.js?v=20261125-live-rounds"></script>
</body>
</html>
